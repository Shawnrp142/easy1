<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Reverse Engineering</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: #0d1117;
            color: #e6edf3;
            font-family: Arial, sans-serif;
        }
        header {
            background: #161b22;
            padding: 20px 30px;
            border-bottom: 1px solid #30363d;
        }
        header h1 {
            margin: 0;
            font-size: 22px;
        }
        header p {
            margin: 6px 0 0;
            color: #8b949e;
        }
        .container {
            max-width: 1500px;
            margin: auto;
            padding: 30px;
        }
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            min-height: 650px;
        }
        .panel-header {
            background: #161b22;
            padding: 12px 16px;
            color: #8b949e;
            border-bottom: 1px solid #30363d;
            font-family: Consolas, monospace;
        }
        #codeEditor {
            width: 100%;
            height: 600px;
            resize: none;
            margin: 0;
            padding: 20px;
            border: none;
            outline: none;
            background: #010409;
            color: #e6edf3;
            font-family: Consolas, Monaco, monospace;
            font-size: 14px;
            line-height: 1.6;
            tab-size: 4;
            white-space: pre;
            overflow: auto;
        }
        #output {
            margin: 0;
            padding: 20px;
            height: 600px;
            overflow: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #3fb950;
            font-family: Consolas, Monaco, monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        #runButton {
            background: #238636;
            color: white;
        }
        #runButton:hover {
            background: #2ea043;
        }
        #resetButton {
            background: #30363d;
            color: white;
        }
        #resetButton:hover {
            background: #484f58;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Python Reverse Engineering Workshop</h1>
    <p>Read, modify and reverse engineer the Python program.</p>
</header>

<div class="container">
    <div class="workspace">
        <div class="panel">
            <div class="panel-header" id="fileNameHeader">Source Code</div>
            <textarea id="codeEditor" spellcheck="false"></textarea>
        </div>
        <div class="panel">
            <div class="panel-header">Terminal</div>
            <pre id="output">\$ Loading Python environment...</pre>
        </div>
    </div>
    <div class="controls">
        <button id="runButton" onclick="runCode()" disabled>▶ Run Python</button>
        <button id="resetButton" onclick="resetCode()">↻ Reset Code</button>
    </div>
</div>

<script>
    // Safe injection via server-side JSON context encapsulation
    const serverContext = {
        easyPyName: {{ easy_py_name | default("easy.py") | tojson }},
        easyPyCode: {{ easy.py | tojson }},
        supportFile: {{ support_file | tojson }},
        supportCode: {{ support_code | tojson }}
    };

    const codeEditor = document.getElementById("codeEditor");
    const output = document.getElementById("output");
    const runButton = document.getElementById("runButton");
    const fileNameHeader = document.getElementById("fileNameHeader");

    // Initialize UI using backend state definitions safely
    fileNameHeader.textContent = `Source Code — ${serverContext.easyPyName}`;
    codeEditor.value = serverContext.easyPyCode;

    let pyodide = null;

    async function initialisePython() {
        output.textContent = "\$ Loading Python environment...";
        try {
            pyodide = await loadPyodide();
            pyodide.FS.writeFile(serverContext.supportFile, serverContext.supportCode);
            output.textContent = "\$ Ready.";
            runButton.disabled = false;
        } catch (error) {
            output.textContent = "Failed to load Python environment.\n\n" + error;
        }
    }

    async function runCode() {
        const code = codeEditor.value;
        runButton.disabled = true;
        output.textContent = `$ python ${serverContext.easyPyName}\n\n`;
        
        let terminalOutput = "";
        const appendOutput = (text) => {
            terminalOutput += text + "\n";
            output.textContent = `$ python ${serverContext.easyPyName}\n\n` + terminalOutput;
            output.scrollTop = output.scrollHeight;
        };

        pyodide.setStdout({ batched: appendOutput });
        pyodide.setStderr({ batched: appendOutput });

        try {
            // Keep workspace isolated; only rewrite dependencies if missing or altered
            pyodide.FS.writeFile(serverContext.supportFile, serverContext.supportCode);
            await pyodide.runPythonAsync(code);
            output.textContent += "\nProcess exited with code 0";
        } catch (error) {
            output.textContent += "\n\n" + error;
        } finally {
            output.scrollTop = output.scrollHeight;
            runButton.disabled = false;
        }
    }

    function resetCode() {
        codeEditor.value = serverContext.easyPyCode;
        output.textContent = "\$ Ready.";
    }

    codeEditor.addEventListener("keydown", function (event) {
        if (event.key === "Tab") {
            event.preventDefault();
            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 4;
        }
    });

    initialisePython();
</script>
</body>
</html>
